name: Phase 1 Runtime Baseline

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker/**"
      - "backend/**"
      - "satellites/**"
      - "frontend/**"
      - "scripts/phase1_baseline.py"
      - ".github/workflows/phase1-runtime-baseline.yml"
  workflow_dispatch:

jobs:
  compose-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Install WebSocket probe dependency
        run: python -m pip install --disable-pip-version-check websockets

      - name: Wait for backend and frontend
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl --silent --fail http://localhost:8000/api/satellites >/dev/null && curl --silent --fail http://localhost:3000/ >/dev/null; then
              echo "Backend API and frontend responded."
              exit 0
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --tail=200 mission-control frontend
          exit 1

      - name: Check API, five nodes, tasks, election and WebSocket
        run: python scripts/phase1_baseline.py --base-url http://localhost:8000 --frontend-url http://localhost:3000

      - name: Capture container state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v
