# OrbitTrack API gateway (Unit 4: distributed web-based systems)
#  - one entry point for browsers and satellites
#  - primary Mission Control + warm standby (failover on connection errors / 502 / 504)
#  - 1 s micro-cache on the busiest read-only dashboard endpoints
#  - per-client rate limiting, WebSocket proxying, static frontend
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
    proxy_cache_path /var/cache/nginx/orbit levels=1:2 keys_zone=orbit:10m max_size=50m inactive=1m use_temp_path=off;

    upstream mission_control {
        server mission-control:8000 max_fails=2 fail_timeout=5s;
        server mission-control-standby:8000 backup;
    }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        add_header X-Gateway "orbittrack-nginx" always;

        location /ws {
            proxy_pass http://mission_control;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Read-heavy, polled every second by every open dashboard: serve from a 1 s cache.
        location ~ ^/api/(satellites|fa2/state|fa2/status|observatory/stats|fa2/clocks)$ {
            limit_req zone=api burst=80 nodelay;
            limit_req_status 429;
            proxy_cache orbit;
            proxy_cache_methods GET;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Upstream $upstream_addr always;
            proxy_pass http://mission_control;
            proxy_next_upstream error timeout http_502 http_504;
        }

        location /api/ {
            limit_req zone=api burst=80 nodelay;
            limit_req_status 429;
            client_max_body_size 12m;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Upstream $upstream_addr always;
            proxy_pass http://mission_control;
            # Not http_503: a simulated ground blackout answers 503 on purpose and must not fail over.
            proxy_next_upstream error timeout http_502 http_504;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
